[mod]
id = "vastpacks_native"
version = "0.1.0"
priority = 100

# The Horizon commit it was built and tested on.
[compatibility]
horizon_revision = "fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca"

# The game's side: opening backpacks, keeping what they hold in the world.
[[module]]
id = "client"
file = "crates/horizon-client/src/game.rs"
name = "vastpacks_client"
source = "client.rs"

# A backpack used in the main hand (in the air or on a block a use reaches).
[[injection]]
id = "use-item"
hook = "use_item"
hook_version = 1
kind = "HEAD"
helper = "use_item.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "claimed", ty = "&mut bool", value = "&mut *claimed" },
]

# The menus asked for, opened outside the use.
[[injection]]
id = "server-tick"
hook = "server_tick"
hook_version = 1
kind = "HEAD"
helper = "server_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# A backpack's menu closed, for any reason: its slots to its file.
[[injection]]
id = "menu-input-closed"
# Not in the public hook list yet (its API version is still a placeholder): injected into the function itself.
target = "horizon_client::game::native_hooks::Game<'_>::native_menu_input_closed"
kind = "HEAD"
helper = "menu_input_closed.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "uuid", ty = "u128", value = "uuid" },
  { name = "window", ty = "i32", value = "window" },
  { name = "slots", ty = "&mut Vec<Option<horizon_client::items::ItemStack>>", value = "&mut *slots" },
]

[[injection]]
id = "list"
hook = "mods"
hook_version = 1
kind = "HEAD"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]
